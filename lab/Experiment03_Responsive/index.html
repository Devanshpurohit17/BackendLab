<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exp 3 - Responsive Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <nav><strong>Responsive Page</strong><a href="#row">Flexbox</a><a href="#grid">Grid</a></nav>
</header>
<main>
  <section class="row" id="row">
    <div class="card"><h2>One</h2><p>Cards stack on mobile.</p></div>
    <div class="card"><h2>Two</h2><p>They form a row from 600px.</p></div>
  </section>
  <section class="grid" id="grid">
    <div class="card"><img src="server.svg" alt="Server"><p>Responsive image</p></div>
    <div class="card"><h2>Node.js</h2><p>JavaScript runtime</p></div>
    <div class="card"><h2>Django</h2><p>Python framework</p></div>
    <div class="card"><h2>MongoDB</h2><p>Document database</p></div>
  </section>
</main>
<footer>The grid has 1, 2 or 4 columns depending on screen width.</footer>
</body>
</html>
