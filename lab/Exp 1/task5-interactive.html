<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 5 - Interactive Elements</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Interactive Elements</h1>
<details open><summary>What is HTML?</summary><p>The language that gives a page its structure.</p></details>
<details><summary>What is a tag?</summary><p>A keyword such as &lt;p&gt; that marks content.</p></details>
<label>Search technology <input list="tech"></label>
<datalist id="tech"><option value="Node.js"><option value="Express"><option value="Django"><option value="MongoDB"></datalist>
<p><button id="open">Open dialog</button></p>
<dialog id="dialog"><p>This is a modal dialog.</p><form method="dialog"><button>Close</button></form></dialog>
<label>Volume <input type="range" id="range" min="0" max="100" value="50"> <output id="out">50</output></label>
<script>
  document.getElementById("open").onclick = () => document.getElementById("dialog").showModal();
  document.getElementById("range").oninput = (e) => document.getElementById("out").value = e.target.value;
</script>
</body>
</html>
