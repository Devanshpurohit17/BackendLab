<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exp 4 - Bootstrap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<nav class="navbar navbar-expand-md navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">Backend Lab</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Menu"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#courses">Courses</a></li>
        <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
        <li class="nav-item"><a class="nav-link" href="tailwind.html">Tailwind</a></li>
      </ul>
    </div>
  </div>
</nav>
<section class="container py-5">
  <div class="row align-items-center">
    <div class="col-md-7"><h1>Learn Backend Development</h1><p class="lead">A responsive page made with Bootstrap.</p></div>
    <div class="col-md-5"><div class="bg-primary text-white p-5 rounded text-center">12-column grid</div></div>
  </div>
</section>
<section class="container" id="courses">
  <div class="row g-3">
    <div class="col-md-4"><div class="card h-100"><div class="card-body"><h2 class="h5">Node.js</h2><p>Servers in JavaScript</p></div></div></div>
    <div class="col-md-4"><div class="card h-100"><div class="card-body"><h2 class="h5">Django</h2><p>Websites in Python</p></div></div></div>
    <div class="col-md-4"><div class="card h-100"><div class="card-body"><h2 class="h5">MongoDB</h2><p>Document database</p></div></div></div>
  </div>
</section>
<section class="container py-5" id="contact">
  <h2>Contact</h2>
  <form class="row g-3" onsubmit="event.preventDefault()">
    <div class="col-md-6 form-group"><label class="form-label" for="name">Name</label><input class="form-control" id="name" required></div>
    <div class="col-md-6 form-group"><label class="form-label" for="email">Email</label><input type="email" class="form-control" id="email" required></div>
    <div class="col-12 form-group"><label class="form-label" for="message">Message</label><textarea class="form-control" id="message" rows="3"></textarea></div>
    <div class="col-12"><button class="btn btn-primary">Send</button></div>
  </form>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
