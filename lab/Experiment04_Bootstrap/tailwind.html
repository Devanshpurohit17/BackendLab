<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exp 4 - Tailwind</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<script src="https://cdn.tailwindcss.com"></script>
<nav class="bg-gray-900 text-white p-4 flex justify-between">
  <a href="index.html" class="font-bold">Backend Lab</a>
  <div class="space-x-4"><a href="#courses">Courses</a><a href="#contact">Contact</a></div>
</nav>
<section class="max-w-5xl mx-auto p-6 grid md:grid-cols-2 gap-6 items-center">
  <div><h1 class="text-4xl font-bold">Learn Backend Development</h1><p class="mt-2">A responsive page made with Tailwind.</p></div>
  <div class="bg-blue-700 text-white p-12 rounded text-center">Utility classes</div>
</section>
<section id="courses" class="max-w-5xl mx-auto p-6 grid md:grid-cols-3 gap-4">
  <div class="border rounded p-4"><h2 class="font-bold">Node.js</h2><p>Servers in JavaScript</p></div>
  <div class="border rounded p-4"><h2 class="font-bold">Django</h2><p>Websites in Python</p></div>
  <div class="border rounded p-4"><h2 class="font-bold">MongoDB</h2><p>Document database</p></div>
</section>
<section id="contact" class="max-w-5xl mx-auto p-6">
  <h2 class="text-2xl font-bold mb-4">Contact</h2>
  <form class="grid md:grid-cols-2 gap-4" onsubmit="event.preventDefault()">
    <label>Name <input class="w-full border rounded px-3 py-2" required></label>
    <label>Email <input type="email" class="w-full border rounded px-3 py-2" required></label>
    <label class="md:col-span-2">Message <textarea class="w-full border rounded px-3 py-2" rows="3"></textarea></label>
    <button class="bg-blue-700 text-white rounded px-4 py-2">Send</button>
  </form>
</section>
<footer class="bg-gray-900 text-white p-4 text-center">Experiment 4</footer>
</body>
</html>
