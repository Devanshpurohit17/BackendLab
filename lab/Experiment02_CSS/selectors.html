<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 2 - Selectors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<style>
  h1 { color: steelblue; }                         /* 1 element */
  .note { background: lightyellow; }               /* 2 class */
  #main-box { border: 2px solid #555; padding: 10px; } /* 3 id */
  #main-box p { margin: 6px 0; }                   /* 4 descendant */
  ul > li { list-style: square; }                  /* 5 child */
  h2 + p { font-style: italic; }                   /* 6 adjacent sibling */
  h2 ~ ul { color: darkgreen; }                    /* 7 general sibling */
  input[type="email"] { border: 2px solid purple; } /* 8 attribute */
  a:hover { color: crimson; }                      /* 9 pseudo-class */
  li:nth-child(odd) { background: #eee; }          /* 10 pseudo-class */
  .note::before { content: "Note: "; font-weight: bold; } /* 11 pseudo-element */
  h1, h2 { text-transform: uppercase; }            /* 12 group */
</style>
<h1>CSS selectors</h1>
<div id="main-box">
  <h2>Heading</h2>
  <p>This paragraph comes right after the heading.</p>
  <p class="note">Styled by class.</p>
  <ul><li>One</li><li>Two</li><li>Three</li></ul>
  <label>Email <input type="email"></label>
  <p><a href="index.html">Hover on this link</a></p>
</div>
</body>
</html>
