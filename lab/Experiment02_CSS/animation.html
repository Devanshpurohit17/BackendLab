<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 4 - Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<style>
  body { background: linear-gradient(120deg, #e3f2fd, #f1f8e9, #e3f2fd); background-size: 300% 300%; animation: move 12s infinite; }
  @keyframes move { 50% { background-position: 100% 50%; } }
  .cards { display: flex; flex-wrap: wrap; gap: 16px; }
  .card { background: white; padding: 24px; border-radius: 8px; transition: transform 0.3s, box-shadow 0.3s; }
  .card:hover { transform: translateY(-8px); box-shadow: 0 8px 16px #0003; }
  .spinner { width: 40px; height: 40px; border: 5px solid #ccc; border-top-color: steelblue; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { body, .spinner { animation: none; } }
</style>
<h1>Animation gallery</h1>
<div class="cards"><div class="card">HTML</div><div class="card">CSS</div><div class="card">JavaScript</div></div>
<h2>Loading</h2>
<div class="spinner"></div>
</body>
</html>
